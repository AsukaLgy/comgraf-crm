name: comgraf
services:
  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-comgraf}
      MYSQL_USER: ${MYSQL_USER:-comgraf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Genera .env con scripts/configure.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Genera .env con scripts/configure.py}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      UPLOAD_DIR: /data/uploads
      STATIC_DIR: /app/frontend/dist
      MAIL_ENCRYPTION_KEY_FILE: /data/mail-secrets/fernet.key
    volumes:
      - uploads:/data/uploads
      - mail_secrets:/data/mail-secrets
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)']
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [internal, web]
  https_proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      HTTPS_HOST: ${HTTPS_HOST:-localhost}
    ports:
      - '${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443'
      - '${HTTP_BIND:-${HTTPS_BIND:-127.0.0.1}}:${HTTP_REDIRECT_PORT:-8080}:80'
    volumes:
      - ./.runtime/camera-https/server:/certs:ro
      - ./scripts/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [web]
volumes:
  mysql_data:
  uploads:
  mail_secrets:
networks:
  internal:
    internal: true
  web:
